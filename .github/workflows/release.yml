name: Windows CI and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-2022

    steps:
      - name: Checkout EndfieldDataBridge
        uses: actions/checkout@v7
        with:
          path: EndfieldDataBridge
          persist-credentials: false

      - name: Checkout ApplepieManager
        uses: actions/checkout@v7
        with:
          repository: zonemodAE/ApplepieManager
          path: ApplepieManager
          persist-credentials: false

      - name: Build and verify
        run: .\build.bat /verify
        working-directory: EndfieldDataBridge
        shell: cmd

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: EndfieldDataBridge
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $productVersion = (Get-Item 'bin\EndfieldDataBridge.dll').VersionInfo.ProductVersion
          if ($productVersion -ne $tagVersion) {
            throw "Git tag version $tagVersion does not match DLL ProductVersion $productVersion"
          }

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: EndfieldDataBridge-windows-x64
          path: |
            EndfieldDataBridge/bin/EndfieldDataBridge.dll
            EndfieldDataBridge/bin/efb_reader.exe
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: EndfieldDataBridge-windows-x64
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/EndfieldDataBridge.dll
            release-assets/efb_reader.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
